name: Segurança e dependências

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Scan tracked workspace for credential patterns
        run: node scripts/security-scan.mjs .
      - name: Verify scanner control negative
        run: node scripts/security-scan.test.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - name: Publish audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.sha }}
          path: npm-audit.json
