name: Bump de versão SemVer

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.ts'

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determinar bump pelas mensagens de commit
        id: bump
        run: |
          SINCE=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          COMMITS=$(git log --format=%B "$SINCE"..HEAD)
          if echo "$COMMITS" | grep -qE "BREAKING CHANGE|^[a-z]+(\([^)]*\))?!:"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qE "^(feat|plugin)(\(|:)"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qE "^(fix|perf)(\(|:)"; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "type=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar bump no package.json
        if: steps.bump.outputs.type != 'none'
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const [M, m, p2] = p.version.split('.').map(Number);
            const t = '${{ steps.bump.outputs.type }}';
            p.version = t === 'major' ? (M + 1) + '.0.0'
                      : t === 'minor' ? M + '.' + (m + 1) + '.0'
                      : M + '.' + m + '.' + (p2 + 1);
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('Nova versão: ' + p.version);
          "

      - name: Commit e tag
        if: steps.bump.outputs.type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v$(node -p "require('./package.json').version")"
          git tag "v$(node -p "require('./package.json').version")"
          git push && git push --tags
