name: Adicionar issue ao quadro

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1
        with:
          project-url: https://github.com/users/martinsmiguel/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
