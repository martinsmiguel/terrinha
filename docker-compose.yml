services:
  aoe-clone:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # IP desta máquina na rede, para o lobby mostrar o link de convite (o container não enxerga o IP real):
      # LAN_HOST=$(scripts/lan-ip.sh) docker compose up -d --build
      - LAN_HOST=${LAN_HOST:-}
    restart: always
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./server.ts
        - action: rebuild
          path: ./index.html
        - action: rebuild
          path: ./poc.html
        - action: rebuild
          path: ./poc-hud.html
        - action: rebuild
          path: ./poc-avaliacao.html
        - action: rebuild
          path: ./vite.server.config.ts
        - action: rebuild
          path: ./vite.config.ts
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./tsconfig.json
